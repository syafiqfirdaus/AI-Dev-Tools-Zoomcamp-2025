version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finance-calc-db
    environment:
      POSTGRES_USER: financeuser
      POSTGRES_PASSWORD: financepass
      POSTGRES_DB: financedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: finance-calc-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://financeuser:financepass@postgres:5432/financedb
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/app:/app/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: finance-calc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:

networks:
  default:
    name: finance-calc-network
